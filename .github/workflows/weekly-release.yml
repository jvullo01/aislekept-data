name: Weekly database release

on:
  schedule:
    - cron: "17 7 * * 1"   # Mondays 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb==1.4.5

      - name: Run script tests
        run: |
          python3 scripts/test_build_product_database.py
          python3 scripts/test_brand_coverage.py

      - name: Download the Open Food Facts CSV export
        run: |
          curl --fail --location --retry 3 --retry-delay 30 --silent --show-error \
            -o products.csv.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
          ls -l products.csv.gz

      - name: Build the US and Canada database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(date -u +%Y%m%d)
          # A second run on the same day gets its own tag, so an earlier release is never overwritten.
          if gh release view "db-$VERSION" >/dev/null 2>&1; then VERSION=$(date -u +%Y%m%d-%H%M); fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 scripts/build_product_database.py --csv products.csv.gz \
            --output AisleKept-products.sqlite --version "$VERSION"
          rm products.csv.gz

      - name: Sanity check the database
        run: |
          COUNT=$(python3 -c "import sqlite3; print(sqlite3.connect('AisleKept-products.sqlite').execute('SELECT count(*) FROM products').fetchone()[0])")
          echo "Products: $COUNT"
          # A sudden drop means a broken export; keep last week's release instead.
          test "$COUNT" -ge 500000

      - name: Compress and write the manifest
        run: |
          python3 scripts/package_release.py --database AisleKept-products.sqlite \
            --version "$VERSION" --output-directory release \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/db-$VERSION"
          cp DATA-LICENSE.md release/DATA-LICENSE.md

      - name: Count store-brand coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-release
          # The latest release before this one; the first release with counts has nothing to compare.
          gh release download --pattern brand-coverage.json --dir previous-release || echo "No previous brand counts"
          python3 scripts/brand_coverage.py --database AisleKept-products.sqlite \
            --output release/brand-coverage.json --previous previous-release/brand-coverage.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="db-$VERSION"
          gh release create "$TAG" release/* --title "Product database $VERSION" \
            --notes "US and Canada products derived from Open Food Facts. Licensed under the ODbL 1.0; see DATA-LICENSE.md. Store-brand counts: brand-coverage.json." --latest
